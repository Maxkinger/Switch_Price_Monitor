# 本 Compose 项目只承载 Task 2 的一次性本地 PostgreSQL 集成测试，固定项目名可防止误操作其他 Compose 项目。
name: switch-price-monitor-task2

services:
  postgres:
    # PostgreSQL 17 与目标生产主版本保持一致；镜像同时支持本地 M1 的 linux/arm64 与 NAS 的 linux/amd64。
    image: postgres:17
    environment:
      # switch_test 账号、密码和数据库名仅供可随时销毁的本地测试基础设施使用，不是生产凭据，也不得复制到 NAS 配置。
      POSTGRES_USER: switch_test
      POSTGRES_PASSWORD: switch_test
      POSTGRES_DB: switch_test
    ports:
      # 54329 只绑定回环地址，唯一用途是让宿主机 Vitest 连接一次性测试库；生产 Compose 禁止复制此端口映射或向局域网暴露 PostgreSQL。
      - "127.0.0.1:54329:5432"
    tmpfs:
      # 数据目录使用内存文件系统，容器销毁后测试数据不可恢复；这能避免测试污染本机、NAS 或其他项目的持久数据库。
      - /var/lib/postgresql/data
    healthcheck:
      # 健康检查只验证当前容器内的 switch_test 测试库可接受连接，不输出密码、令牌或业务数据。
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
